general {
  lock_cmd = ~/.config/hypr/hypridle_scripts/lock.sh
  before_sleep_cmd = loginctl lock-session
}

# Lock after 1.5 minute of inactivity
listener {
    timeout = 90
    on-timeout = ~/.config/hypr/hypridle_scripts/checkAndLock.sh
}

listener {
  timeout = 1
  on-timeout = ~/.config/hypr/hypridle_scripts/userInputCheck.sh 0
  on-resume = ~/.config/hypr/hypridle_scripts/userInputCheck.sh 1
}
